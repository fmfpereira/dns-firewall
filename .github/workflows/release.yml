name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.2.3)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build Release Artifacts
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            goarm: ""
            suffix: linux_amd64
          - goos: linux
            goarch: arm64
            goarm: ""
            suffix: linux_arm64
          - goos: linux
            goarch: arm
            goarm: "7"
            suffix: linux_armv7

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          mkdir -p dist/package
          go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o dist/package/dns-firewall ./cmd/dns-firewall
          cp README.md LICENSE dist/package/
          cp config/dns-firewall.json.example dist/package/
          cp systemd/dns-firewall.service dist/package/

      - name: Package
        env:
          VERSION: ${{ inputs.tag || github.ref_name }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          tar -C dist/package -czf "dist/dns-firewall_${VERSION}_${SUFFIX}.tar.gz" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dns-firewall_${{ inputs.tag || github.ref_name }}_${{ matrix.suffix }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum *.tar.gz > checksums.txt

      - name: Publish release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            dist/*.tar.gz
            dist/checksums.txt
          generate_release_notes: true
